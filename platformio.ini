; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-super-mini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
; WiFi + HTTPS + BLE (Bluedroid) together no longer fit the default
; 1.25MB app slot. huge_app = one 3MB app slot (no OTA, which this
; project doesn't use). The NVS partition stays at the same offset, so
; saved WiFi credentials / relay modes / thresholds survive the switch.
board_build.partitions = huge_app.csv
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = 
	z3t0/IRremote@^4.4.1
	adafruit/Adafruit SSD1306@^2.5.13
	adafruit/Adafruit GFX Library@^1.11.11

